name: Daily Stock Report

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '수동 실행 모드 (auto / krx / nxt / us)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - krx
          - nxt
          - us

jobs:
  run-report:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필수 라이브러리 설치
        run: pip install requests feedparser google-genai

      - name: 급등주 리포트 실행
        run: |
          if [ "${{ inputs.mode }}" != "" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            python daily_stock.py ${{ inputs.mode }}
          else
            python daily_stock.py
          fi
