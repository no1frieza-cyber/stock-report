name: Daily Stock Report

on:
  schedule:
    # 정각(00분)·30분 혼잡을 피해 3~5분 비켜서 설정 (UTC 기준)
    - cron: '5 22 * * 1-5'    # 화~토 07:05 KST (미국 US)
    - cron: '33 23 * * 0-4'   # 월~금 08:33 KST (국내 NXT 프리)
    - cron: '33 0 * * 1-5'    # 월~금 09:33 KST (국내 KRX 초반)
    - cron: '3 6 * * 1-5'     # 월~금 15:03 KST (국내 KRX 마감 전)
    - cron: '33 10 * * 1-5'   # 월~금 19:33 KST (국내 NXT 애프터)9:30 KST (국내 NXT 애프터)
  workflow_dispatch:
    inputs:
      mode:
        description: '수동 실행 모드 (auto / krx / nxt / us)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - krx
          - nxt
          - us

jobs:
  run-report:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필수 라이브러리 설치
        run: pip install requests feedparser google-genai

      - name: 급등주 리포트 실행
        run: |
          if [ "${{ inputs.mode }}" != "" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            python daily_stock.py ${{ inputs.mode }}
          else
            python daily_stock.py
          fi
